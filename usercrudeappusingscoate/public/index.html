<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users CRUD App</title>
</head>
<body>

    <h1>USers Crud APP</h1>

    <div id="edit-box">
        Id :-<input type="text" name="" id="id" disabled><br><br>
        Name :-<input type="text" name="" id="updatedName"><br><br>
        Email :-<input type="text" name="" id="updatedEmail"><br><br>
        <button onclick="updateUser()">Edit User</button>
    </div>

    <div id="add-box">
        <h1>Add user</h1>
        Enter name:<input type="text" name="" id="name"><br><br>
        Enter Email:<input type="text" name="" id="email"><br><br>
        <button onclick="addUser()">Add</button>
    </div>

    <div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="result">
                
            </tbody>
        </table>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket=io();

        document.getElementById('edit-box').style.display='none';
        socket.on('users',(data)=>{
            document.getElementById('result').innerHTML='';
            
            data.map((user)=>{
                document.getElementById('result').innerHTML+=`
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><button onclick='editUser(${user.id},"${user.name}","${user.email}")'>Edit</button></td>
                    <td><button onclick="deleteUser(${user.id})">Delete</button></td>
                </tr>
                `
            })

        })
        function addUser(){
            const name=document.getElementById('name').value;
            const email=document.getElementById('email').value;
            socket.emit('add-user',{name,email})
            document.getElementById('name').value='';
            document.getElementById('email').value='';
        }

        function deleteUser(id){
            socket.emit('delete-user',id)
        }   

        function editUser(id,name,email){
            document.getElementById('edit-box').style.display='block';
            document.getElementById('add-box').style.display='none';
            document.getElementById('id').value=id;
            document.getElementById('updatedName').value=name;
            document.getElementById('updatedEmail').value=email;
        }

        function updateUser() {
            const id=document.getElementById('id').value;
            const name=document.getElementById('updatedName').value;
            const email=document.getElementById('updatedEmail').value;

            socket.emit('update-user', {id,name,email});

            document.getElementById('edit-box').style.display='none';
            document.getElementById('add-box').style.display='block';
            document.getElementById('id').value='';
            document.getElementById('updatedName').value='';
            document.getElementById('updatedEmail').value='';
        }
    </script>
    
</body>
</html>
